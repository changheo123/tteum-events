# 매시간 이벤트 수집 → 검증 → 사이트 빌드 → GitHub Pages 배포
# 수집이 실패하면 기존 DB로, 빌드·브라우저 검증이 실패하면 배포하지 않아 이전 사이트가 그대로 유지된다
name: collect-and-deploy

on:
  schedule:
    - cron: "23 * * * *"   # 매시 23분(UTC 기준, 한국 시간도 매시 23분). 정시 직후 혼잡을 피함
  workflow_dispatch:
    inputs:
      force:
        description: "주기와 관계없이 모든 출처 수집"
        type: boolean
        default: false
  push:
    branches: [live]
    paths-ignore: ["data/**", "README.md"]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write   # 이어달리기(next-run)가 다음 실행을 요청할 때 필요

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 데이터 커밋이 겹치지 않게 수집 작업만 한 번에 하나씩(이어달리기 대기 중에도 새 실행은 바로 시작)
    concurrency:
      group: collect
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # 브라우저 점검 스크립트가 내장 WebSocket을 씀

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 단위 테스트
        run: python -m pytest tests -q

      - name: 이벤트 수집
        id: collect
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        # 코드가 바뀐 push와 수동 강제 실행은 주기와 관계없이 모든 출처를 다시 수집해 새 코드를 검증한다
        run: python -m collector.pipeline ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force)) && '--force' || '' }}

      - name: 사이트 빌드(건수·링크·스크립트 검증)
        run: python build.py

      - name: 실제 브라우저 점검
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory _site &
          sleep 2
          mkdir -p /tmp/bt
          export CHROME=$(command -v google-chrome || command -v chromium)
          # Chrome이 늦게 뜨는 일시 오류를 고려해 실패하면 한 번 더 시도한다
          node tests/browser_test.mjs http://127.0.0.1:8765/ /tmp/bt || (sleep 5 && node tests/browser_test.mjs http://127.0.0.1:8765/ /tmp/bt)

      - name: 수집 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1

      - name: 수집 실패 알림
        if: steps.collect.outcome == 'failure'
        run: echo "::warning::수집 단계가 실패해 기존 데이터로 배포했습니다. data/runs.json을 확인하세요."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 이어달리기: GitHub 예약(cron)이 돌지 않을 때를 대비해 50분 뒤 다음 실행을 직접 요청한다.
  # 최근 2시간 안에 예약 실행이 있었으면 cron이 살아 있는 것이므로 요청하지 않고 끝낸다.
  # 수집·배포가 실패해도 다음 회차는 이어지도록 always()로 둔다.
  next-run:
    needs: deploy
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    concurrency:
      group: next-run
      cancel-in-progress: true   # push가 여러 번 있어도 이어달리기는 최신 하나만
    steps:
      - name: 예약 실행 확인 후 50분 뒤 다음 실행 요청
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          recent=$(gh run list --workflow collect.yml --event schedule --limit 1 --json createdAt --jq '.[0].createdAt // ""')
          if [ -n "$recent" ] && [ $(( $(date +%s) - $(date -d "$recent" +%s) )) -lt 7200 ]; then
            echo "예약 실행이 동작 중($recent)이라 이어달리기를 멈춥니다"; exit 0
          fi
          sleep 3000
          recent=$(gh run list --workflow collect.yml --event schedule --limit 1 --json createdAt --jq '.[0].createdAt // ""')
          if [ -n "$recent" ] && [ $(( $(date +%s) - $(date -d "$recent" +%s) )) -lt 7200 ]; then
            echo "기다리는 동안 예약 실행이 돌았습니다($recent). 이어달리기를 멈춥니다"; exit 0
          fi
          gh workflow run collect.yml --ref "${{ github.ref_name }}"
          echo "다음 수집 실행을 요청했습니다"
